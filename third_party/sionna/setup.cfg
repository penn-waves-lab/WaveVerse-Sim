# Restored by the WaveVerse authors (2026) for the bundled editable installation.
[metadata]
name = sionna
version = 0.19.2
description = Sionna 0.19.2 with WaveVerse scattering-candidate patches
license = Apache-2.0

[options]
package_dir =
    = .
packages = find:
include_package_data = True
python_requires = >=3.8
install_requires =
    tensorflow>=2.13,<2.16
    numpy<2
    matplotlib>=3.5.3
    scipy>=1.6
    importlib_resources
    mitsuba>=3.2,<3.6
    pythreejs>=2.4.2
    ipywidgets>=8.0.4
    ipydatawidgets==4.3.2
    jupyterlab-widgets==3.0.5

[options.package_data]
* = *.csv, *.npy, *.json, *.xml, *.ply

[options.packages.find]
include = sionna*
